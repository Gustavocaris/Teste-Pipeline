<!DOCTYPE html>
<!--Ela informa ao navegador que o documento está usando HTML5.
Sem isso, o navegador pode entrar em “modo de compatibilidade” e interpretar o código de forma diferente.-->

<html lang="en">
<!--É a raiz do documento — tudo fica dentro dela.
lang="en" → define o idioma da página. Isso é importante para acessibilidade, SEO e para que os navegadores possam renderizar o conteúdo corretamente.-->
<head>
    <!--Cabeçalho do documento, onde ficam as informações sobre a página, como título, metadados, links para estilos e scripts.-->
    <meta charset="UTF-8">
    <!--Define a codificação de caracteres do documento como UTF-8, que é o padrão moderno e suporta uma ampla gama de caracteres.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Configura a viewport para dispositivos móveis, garantindo que a página seja responsiva e se ajuste corretamente em telas menores.-->
    <title>Document</title>
    <!--Define o título da página, que aparece na aba do navegador e é importante para SEO.-->
</head>
<body>
    <!--Corpo do documento, onde fica o conteúdo visível da página.-->
    
</body>
</html>
